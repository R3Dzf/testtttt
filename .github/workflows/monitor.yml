name: Monitor UC KA171 Notifications

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      send_test:
        description: "Send a test ntfy notification"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - "trigger-test.txt"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check KA171 Notifications
        id: check
        run: python monitor.py

      - name: Send ntfy alert when notifications change
        if: steps.check.outputs.changed == 'true'
        env:
          KA171_DETAILS: ${{ steps.check.outputs.details }}
        run: python send_ntfy.py

      - name: Send ntfy test notification
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.send_test == true)
        env:
          NTFY_TEST: "true"
        run: python send_ntfy.py

      - name: Save latest state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update KA171 notification state"
            git push
          fi
